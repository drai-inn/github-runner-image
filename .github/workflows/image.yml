name: image

# Builds on GitHub-hosted runners: this repository is public, and a fork's pull
# request must never run on the self-hosted runners this image makes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: runner:test
      - name: Check the tools
        run: >-
          docker run --rm --entrypoint bash runner:test -c
          'gh --version && uv --version && node --version && git --version && jq --version && ./config.sh --version'
      - if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - if: github.event_name == 'push'
        run: echo "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
